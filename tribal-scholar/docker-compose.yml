version: '3.8'
services:
  # For prototype, SQLite is used, so Postgres optional. Uncomment for production-like.
  # db:
  #   image: postgres:15
  #   environment:
  #     POSTGRES_DB: tribalscholar
  #     POSTGRES_USER: tribalscholar
  #     POSTGRES_PASSWORD: demo_password
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./tribal_scholar.db
      - SECRET_KEY=change-me-to-a-strong-random-secret-key-demo-only-32chars
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      # - db
      - frontend

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8000/api/v1

